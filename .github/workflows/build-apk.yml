name: Build Kivy APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILDOZER_VERSION: "1.6.0"
  # p4a "develop", NOT the v2026.05.09 tag. That release resolves
  # charset-normalizer (pulled in by the Kivy recipe's requests dependency) to
  # its Android wheel, then installs it with host pip, which rejects it:
  #   ERROR: charset_normalizer-...-android_24_arm64_v8a.whl
  #          is not a supported wheel on this platform
  # Fixed upstream in python-for-android#3366, which is on develop.
  # develop is a moving branch, so this job refreshes it on every run.
  P4A_REF: "develop"
  CYTHON_VERSION: "0.29.36"

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Gradle 8.x + the Android Gradle Plugin need Java 17. The ubuntu-22.04
      # runner ships Temurin 11, 17 and 21 but points JAVA_HOME at 11, and
      # apt-installing a JDK does NOT move JAVA_HOME -- which is why Gradle kept
      # resolving /usr/lib/jvm/temurin-11-jdk-amd64 and failing to apply the
      # plugin. setup-java is what actually sets JAVA_HOME for the whole job.
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # No JDK here on purpose: setup-java above owns the Java toolchain.
          sudo apt-get install -y --no-install-recommends \
            git zip unzip \
            autoconf automake libtool libltdl-dev pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev patch ccache

      - name: Install Buildozer and Cython
        run: |
          set -eu
          python -m venv .venv
          source .venv/bin/activate
          # NOTE: no "pip<25" pin. That pin never touched the venv that was
          # actually failing, and it risks breaking buildozer's own install.
          python -m pip install --upgrade pip setuptools wheel
          pip install \
            "buildozer==${BUILDOZER_VERSION}" \
            "cython==${CYTHON_VERSION}" \
            virtualenv

      # Belt and braces for the charset-normalizer failure above, in case
      # develop regresses. charset-normalizer only began publishing Android
      # wheels at 3.5.0, so pinning below that leaves only the universal wheel
      # and p4a cannot select a platform wheel it is unable to install.
      # 3.3.2 still satisfies Kivy's charset-normalizer>=3.0.0.
      # Unlike buildozer.spec requirements, PIP_CONSTRAINT does govern the
      # resolution step p4a uses.
      - name: Write pip constraints
        run: echo "charset-normalizer==3.3.2" > "${GITHUB_WORKSPACE}/constraints.txt"

      # Holds the Android SDK/NDK and the p4a checkout (several GB).
      # Without this, every run redownloads them and rebuilds CPython: ~45 min.
      - name: Cache Buildozer SDK/NDK and p4a
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ env.BUILDOZER_VERSION }}-${{ env.P4A_REF }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-${{ env.BUILDOZER_VERSION }}-${{ env.P4A_REF }}-

      # Two jobs here:
      #  1. Keep the cached p4a checkout current with P4A_REF. The cache can
      #     restore a weeks-old develop, which would miss the fix above.
      #  2. Patch out p4a's pip self-upgrade. run_pymodules_install upgrades pip
      #     from inside the venv it is running from; the upgrade half-rewrites
      #     the pip package, so the next import mixes new build_env code with
      #     old cli/spinners code and fails with:
      #       ImportError: cannot import name 'open_rich_spinner'
      #                    from 'pip._internal.cli.spinners'
      #     The patch is idempotent and only warns if upstream has dropped the
      #     line, so it is safe to leave in place after an upstream fix.
      - name: Fetch and patch python-for-android
        run: |
          set -eu
          P4A_DIR="$HOME/.buildozer/android/platform/python-for-android"
          if [ -d "$P4A_DIR/.git" ]; then
            git -C "$P4A_DIR" fetch --depth 1 origin "${P4A_REF}"
            git -C "$P4A_DIR" reset --hard FETCH_HEAD
          else
            mkdir -p "$(dirname "$P4A_DIR")"
            git clone --depth 1 --branch "${P4A_REF}" \
              https://github.com/kivy/python-for-android.git "$P4A_DIR"
          fi
          git -C "$P4A_DIR" log -1 --oneline
          python3 - "$P4A_DIR/pythonforandroid/build.py" <<'PY'
          import re
          import sys

          path = sys.argv[1]
          marker = "buildozer-ci: pip self-upgrade disabled"

          with open(path, encoding="utf-8") as fh:
              src = fh.read()

          if marker in src:
              print("Already patched: %s" % path)
              sys.exit(0)

          lines = src.splitlines(keepends=True)
          pattern = re.compile(r"'install'\s*,\s*'-U'\s*,\s*'pip'")
          hit = next((i for i, line in enumerate(lines) if pattern.search(line)), None)

          if hit is None:
              print("::warning::No pip self-upgrade call found in %s. "
                    "Upstream may have fixed it; if the build still fails with "
                    "open_rich_spinner, update this patch." % path)
              sys.exit(0)

          # Walk back to the start of the statement, then forward to its close.
          start = hit
          while start >= 0 and "shprint(" not in lines[start]:
              start -= 1
          if start < 0:
              start = hit

          depth = 0
          end = start
          for i in range(start, len(lines)):
              depth += lines[i].count("(") - lines[i].count(")")
              end = i
              if depth <= 0:
                  break

          indent = re.match(r"\s*", lines[start]).group(0)
          lines[start:end + 1] = ["%spass  # %s\n" % (indent, marker)]

          with open(path, "w", encoding="utf-8") as fh:
              fh.write("".join(lines))

          print("Patched %s (lines %d-%d)" % (path, start + 1, end + 1))
          PY

      - name: Build APK
        env:
          PIP_CONSTRAINT: ${{ github.workspace }}/constraints.txt
        run: |
          set -eu
          source .venv/bin/activate
          # Confirm Gradle will get Java 17, not the runner's default 11.
          echo "JAVA_HOME=${JAVA_HOME}"
          java -version
          # Buildozer skips its "pip install --user" bootstrap (which fails in a
          # venv) only when VIRTUAL_ENV is exported. activate does that for us.
          # stdin is closed so any unexpected prompt fails fast instead of
          # hanging for the full timeout.
          buildozer android debug < /dev/null

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kivy-todo-apk
          path: bin/*.apk
          if-no-files-found: error

      # Runs even when the build fails, so a failure leaves you something to read.
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-logs
          path: |
            .buildozer/android/platform/build-*/build.log
            .buildozer/**/*.log
          if-no-files-found: ignore
          retention-days: 7